name: Production Deployment
run-name: Production Deployment - ${{ github.ref_name }}

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_EMAIL: ${{ secrets.VERCEL_EMAIL }}
  PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Configure Git identity for Vercel
      - name: Configure Git identity for Vercel
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "${{ env.VERCEL_EMAIL }}"

      # Configure Git Identifier for Vercel
      - name: Configure Git Identifier for Vercel
        run: git commit --amend --author="GitHub Actions <${{ env.VERCEL_EMAIL }}>" --no-edit

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Link Repository to Vercel Project
      - name: Link Repository to Vercel Project
        run: vercel link --yes --token ${{ env.VERCEL_TOKEN }} --project ${{ env.PROJECT_NAME }}

      # Pull Vercel configuration
      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token ${{ env.VERCEL_TOKEN }}

      # Build the static site (no build step — this just packages the output for Vercel)
      - name: Build project
        run: vercel build --prod --yes

      # Deploy to Vercel
      - name: Deploy to Vercel
        run: vercel deploy --prod --prebuilt --yes --token ${{ env.VERCEL_TOKEN }}
